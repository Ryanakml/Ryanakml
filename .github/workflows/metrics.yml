name: Profile metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/metrics.yml

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate engineering metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Ryanakml
          filename: github-metrics.png
          output_action: commit

          template: classic
          config_output: png
          config_display: columns
          config_timezone: Asia/Jakarta
          config_order: isocalendar, languages, notable, activity
          base: ""
          extras_css: |
            svg {
              color: #C9D1D9 !important;
              background: #0D1117 !important;
            }
            h1, h2, h3 {
              color: #58A6FF !important;
            }
            .field svg {
              fill: #8B949E !important;
            }
            .field.language.details small {
              color: #8B949E !important;
            }

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_ignored: html, css, jupyter notebook
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_details: percentage

          plugin_notable: yes
          plugin_notable_from: organization
          plugin_notable_repositories: yes
          plugin_notable_types: pull_request

          plugin_activity: yes
          plugin_activity_limit: 6
          plugin_activity_days: 30
          plugin_activity_visibility: public
          plugin_activity_filter: pr, review, issue, release
          plugin_activity_timestamps: yes

          retries: 3
          retries_delay: 60
