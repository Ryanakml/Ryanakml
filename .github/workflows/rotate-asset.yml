name: Rotate Daily Asset

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      asset:
        description: "Asset number to use (e.g. 1, 2, 3) — leave empty for automatic rotation"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  rotate-asset:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Normalize & trim assets to 1024x296
        run: |
          python3 <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          assets_dir = Path("assets")
          excluded = {"tired-cat.jpeg", "tired-cat.jpg", "tired-cat.png"}
          valid_exts = {".jpg", ".jpeg", ".png", ".webp"}

          numbered = {}
          unnumbered = []

          for p in sorted(assets_dir.iterdir()):
              if not p.is_file() or p.name in excluded or p.suffix.lower() not in valid_exts:
                  continue
              m = re.fullmatch(r"(\d+)\.jpeg", p.name)
              if m:
                  numbered[int(m.group(1))] = p
              else:
                  unnumbered.append(p)

          next_num = max(numbered.keys(), default=0) + 1
          for p in unnumbered:
              target = assets_dir / f"{next_num}.jpeg"
              p.rename(target)
              numbered[next_num] = target
              next_num += 1

          for num, p in sorted(numbered.items()):
              out = subprocess.check_output(
                  ["identify", "-format", "%wx%h", str(p)], text=True
              ).strip()
              if out != "1024x296":
                  print(f"Trimming {p} ({out}) -> 1024x296")
                  subprocess.run(
                      [
                          "convert",
                          str(p),
                          "-auto-orient",
                          "-resize",
                          "1024x296^",
                          "-gravity",
                          "center",
                          "-crop",
                          "1024x296+0+0",
                          "+repage",
                          "-strip",
                          "-quality",
                          "90",
                          str(p),
                      ],
                      check=True,
                  )
          PY

      - name: Select asset and update README
        env:
          REQUESTED_ASSET: ${{ github.event.inputs.asset }}
        run: |
          python3 <<'PY'
          import os
          import random
          import re
          from pathlib import Path

          assets_dir = Path("assets")
          numbered = sorted(
              [
                  int(m.group(1))
                  for p in assets_dir.iterdir()
                  if (m := re.fullmatch(r"(\d+)\.jpeg", p.name))
              ]
          )

          if not numbered:
              raise SystemExit("No numbered assets found in assets/")

          readme_path = Path("README.md")
          content = readme_path.read_text()

          current_match = re.search(
              r"<!-- DAILY_ASSET:START -->.*?assets/(\d+)\.jpeg.*?<!-- DAILY_ASSET:END -->",
              content,
              flags=re.DOTALL,
          )
          current_num = int(current_match.group(1)) if current_match else None

          requested = os.environ.get("REQUESTED_ASSET", "").strip()
          requested = re.sub(r"\.jpe?g$", "", requested, flags=re.IGNORECASE)

          if requested:
              chosen = int(requested)
              if chosen not in numbered:
                  raise SystemExit(f"Asset {chosen}.jpeg not found in {numbered}")
          else:
              candidates = [n for n in numbered if n != current_num] or numbered
              chosen = random.choice(candidates)

          print(f"Selected asset: assets/{chosen}.jpeg")

          replacement = f"""<!-- DAILY_ASSET:START -->
          <p align="center">
            <img src="assets/{chosen}.jpeg" width="100%" alt="daily mood" />
          </p>
          <!-- DAILY_ASSET:END -->"""

          # Remove leading indentation from replacement
          replacement = "\n".join(line.lstrip() if not line.startswith("  <img") else "  " + line.lstrip() for line in replacement.splitlines())

          updated, count = re.subn(
              r"<!-- DAILY_ASSET:START -->.*?<!-- DAILY_ASSET:END -->",
              replacement,
              content,
              count=1,
              flags=re.DOTALL,
          )

          if count != 1:
              raise SystemExit("DAILY_ASSET markers not found in README.md")

          readme_path.write_text(updated)
          PY

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md assets/

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: rotate daily asset"
          git push
